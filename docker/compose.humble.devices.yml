services:
  dev:
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - "c 13:* rmw"
      - "c 81:* rmw"
      - "c 166:* rmw"
      - "c 188:* rmw"
    environment:
      INPUT_GID: ${INPUT_GID:-}
      SERIAL_GID: ${SERIAL_GID:-}
      SERIAL_GIDS: ${SERIAL_GIDS:-}
      VIDEO_GID: ${VIDEO_GID:-}
